<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#193b30">
<title>NutriLife</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f2;color:#26382e;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
header{background:#193b30;color:white;padding:24px 19px;border-radius:0 0 24px 24px}
header h1{margin:0;font-size:27px}
header p{color:#d6e5da;font-size:13px}
main{max-width:600px;margin:auto;padding:16px}
.card{background:white;border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 2px 9px #00000008}
.summary{background:#e3eee5;border-radius:13px;padding:14px;margin-top:17px}
.big{font-size:30px;font-weight:750;color:#28734e}
.muted{font-size:12px;color:#7a897f}
.progress{height:9px;background:#d4e1d7;border-radius:20px;overflow:hidden;margin:10px 0}
#bar{height:100%;background:#32865b;width:0}
h2{font-size:18px;margin:0 0 5px}
h3{font-size:14px;margin:13px 0 8px;color:#476353}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #edf0ed;font-size:14px}
.item input{width:20px;height:20px;accent-color:#32865b;flex-shrink:0}
.item span{flex:1}
.kcal{font-size:12px;color:#758278;white-space:nowrap}
input[type=date]{padding:10px;border:1px solid #dce4dd;border-radius:9px;width:100%;font-size:15px}
button{padding:11px 15px;border:0;border-radius:10px;background:#193b30;color:white;font-weight:600}
button.secondary{background:#e4ece5;color:#294c37}
footer{text-align:center;color:#89948d;font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
<h1>🍏 NutriLife</h1>
<p>Come bem. Vive melhor.</p>
<div class="summary">
<div class="muted">Calorias consumidas</div>
<div class="big" id="total">0 kcal</div>
<div class="muted" id="planned">Calorias planeadas</div>
<div class="progress"><div id="bar"></div></div>
<div class="muted" id="count">0 alimentos assinalados</div>
</div>
</header>
<main>
<div class="card">
<strong>📅 O meu dia</strong>
<p><input type="date" id="day"></p>
</div>
<div id="meals"></div>
<div class="card">
<h2>Resumo diário</h2>
<p class="muted" id="summary">Ainda não registaste alimentos.</p>
<button class="secondary" onclick="resetDay()">Limpar este dia</button>
</div>
</main>
<footer>NutriLife · O teu diário alimentar</footer>
<script>
const meals=[
{name:"Pequeno-almoço",groups:[
{items:[
["50 g pão de mistura",130],
["5 g manteiga",36],
["20 g queijo light",40],
["200 ml Mimosa Light chocolate",94]
]}
]},
{name:"Meio da manhã",groups:[
{exclusive:true,items:[
["25 g Marinheiras",110],
["Iogurte natural (125 g)",80],
["Barra de cereais",100]
]}
]},
{name:"Almoço",groups:[
{title:"Proteína — escolher uma",exclusive:true,items:[
["Carne branca — 100 g",165],
["Carne vermelha magra — 100 g",175],
["Peixe magro — 120 g",110],
["Peixe gordo — 80 g",160]
]},
{title:"Hidratos / acompanhamento — escolher um",exclusive:true,items:[
["Arroz cozido — 100 g",130],
["Massa cozida — 100 g",155],
["Batata cozida — 150 g",116],
["Legumes — 150 g + azeite — 5 g",70]
]}
]},
{name:"Lanche",groups:[
{items:[
["50 g pão de mistura",130],
["5 g manteiga",36],
["20 g queijo light",40],
["200 ml Compal Light",44]
]}
]},
{name:"Jantar",groups:[
{title:"Proteína — escolher uma",exclusive:true,items:[
["Carne branca — 100 g",165],
["Carne vermelha magra — 100 g",175],
["Peixe magro — 120 g",110],
["Peixe gordo — 80 g",160]
]},
{title:"Hidratos / acompanhamento — escolher um",exclusive:true,items:[
["Arroz cozido — 80 g",104],
["Massa cozida — 80 g",124],
["Batata cozida — 120 g",92],
["Legumes — 150 g + azeite — 5 g",70]
]}
]},
{name:"Doce da noite",groups:[
{exclusive:true,items:[
["Mini chocolate ou mini gelado",70],
["Açaí Natura 0% (80 g) + Molico Light Zero (8 g)",68]
]}
]}
];

const day=document.getElementById("day");
const now=new Date();
day.value=[now.getFullYear(),String(now.getMonth()+1).padStart(2,"0"),String(now.getDate()).padStart(2,"0")].join("-");
let data={};

function key(){return "nutrilife-"+day.value}
function load(){
try{data=JSON.parse(localStorage.getItem(key()))||{}}
catch(e){data={}}
render();
}
function save(){
localStorage.setItem(key(),JSON.stringify(data));
update();
}
function itemKey(m,g,i){return m+"-"+g+"-"+i}

function render(){
let html="";
meals.forEach((meal,m)=>{
html+=`<div class="card"><h2>${meal.name}</h2>`;
meal.groups.forEach((group,g)=>{
if(group.title)html+=`<h3>${group.title}</h3>`;
group.items.forEach((item,i)=>{
let id=itemKey(m,g,i);
let checked=!!data[id];
html+=`<label class="item">
<input type="checkbox" ${checked?"checked":""} onchange="toggle(${m},${g},${i},this.checked)">
<span>${item[0]}</span>
<span class="kcal">${item[1]} kcal</span>
</label>`;
});
});
html+="</div>";
});
document.getElementById("meals").innerHTML=html;
update();
}

function toggle(m,g,i,value){
let group=meals[m].groups[g];
if(group.exclusive&&value){
group.items.forEach((_,j)=>delete data[itemKey(m,g,j)]);
}
let id=itemKey(m,g,i);
if(value)data[id]=true;
else delete data[id];
save();
if(group.exclusive)render();
}

function update(){
let total=0,planned=0,count=0;
meals.forEach((meal,m)=>{
meal.groups.forEach((group,g)=>{
group.items.forEach((item,i)=>{
planned+=item[1];
if(data[itemKey(m,g,i)]){
total+=item[1];count++;
}
});
});
});
document.getElementById("total").textContent=total+" kcal";
document.getElementById("planned").textContent="Calorias assinaladas / opções disponíveis";
document.getElementById("bar").style.width=(planned?Math.min(100,total/planned*100):0)+"%";
document.getElementById("count").textContent=count+" alimentos assinalados";
document.getElementById("summary").textContent=count===0?
"Ainda não registaste alimentos.":
"Já assinalaste "+count+" alimentos, num total de "+total+" kcal.";
}
function resetDay(){
if(confirm("Queres limpar os alimentos deste dia?")){
data={};save();render();
}
}
day.addEventListener("change",load);
load();
</script>
</body>
</html>
